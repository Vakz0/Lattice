name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Verify (tests + typecheck)
        run: npm run verify

      # electron-builder uploads .exe / .blockmap / latest.yml in parallel. If no
      # release exists yet, each upload may race to create one → duplicate releases
      # for the same tag (assets split). Pre-create a single draft first.
      - name: Pre-create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists — reusing it"
          } else {
            gh release create $env:TAG --draft --title $env:TAG --generate-notes
            Write-Host "Created draft release $env:TAG"
          }

      - name: Build and publish NSIS installer
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload widgets catalog
        run: gh release upload "${{ github.ref_name }}" widgets-catalog.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If a race still left duplicates, keep the release with the most assets.
      - name: Deduplicate releases for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rels = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" | ConvertFrom-Json
          $same = @($rels | Where-Object { $_.tag_name -eq $env:TAG })
          Write-Host "Found $($same.Count) release(s) for $env:TAG"
          if ($same.Count -le 1) { return }
          $keep = $same | Sort-Object { @($_.assets).Count } -Descending | Select-Object -First 1
          Write-Host "Keeping id=$($keep.id) assets=$(@($keep.assets).Count)"
          foreach ($r in $same) {
            if ($r.id -eq $keep.id) { continue }
            Write-Host "Deleting duplicate id=$($r.id) assets=$(@($r.assets).Count)"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($r.id)"
          }

      - name: Publish release (undraft)
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release is public with updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metaJson = gh release view $env:TAG --json isDraft,isPrerelease,assets
          Write-Host $metaJson
          $meta = $metaJson | ConvertFrom-Json

          if ($meta.isDraft) {
            Write-Host "::error::Release $env:TAG is still a draft — electron-updater will fail with HTTP 406"
            exit 1
          }

          $names = @($meta.assets | ForEach-Object { $_.name })
          if ($names -notcontains 'latest.yml') {
            Write-Host "::error::Release $env:TAG is missing latest.yml (required by electron-updater)"
            exit 1
          }
          if (-not ($names | Where-Object { $_ -like '*.exe' })) {
            Write-Host "::error::Release $env:TAG is missing the NSIS installer (.exe)"
            exit 1
          }

          # Public download must work without auth (same path end users / electron-updater use)
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/latest.yml"
          $resp = Invoke-WebRequest -Uri $url -UseBasicParsing
          Write-Host "GET $url -> HTTP $($resp.StatusCode)"
          if ($resp.StatusCode -ne 200) {
            Write-Host "::error::Public latest.yml download failed (HTTP $($resp.StatusCode))"
            exit 1
          }
          Write-Host ($resp.Content -split "`n" | Select-Object -First 5 | Out-String)
